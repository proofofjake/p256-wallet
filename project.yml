# Generate the Xcode project with: xcodegen generate
name: P256Wallet
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  WalletCore:
    path: WalletCore

targets:
  P256Wallet:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: App
        excludes:
          - "*.entitlements"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: P256 Wallet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RelyingPartyID: $(RELYING_PARTY_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: WalletCore
    scheme:
      testTargets:
        - P256WalletUITests

  P256WalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: P256Wallet
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.p256wallet.uitests
        TARGETED_DEVICE_FAMILY: "1"
